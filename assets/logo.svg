<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Outline with Glow -->
  <path d="M50 8 L85 24 C85 60 50 88 50 92 C50 88 15 60 15 24 Z" 
        fill="url(#meshGrad)" 
        stroke="url(#shieldGrad)" 
        stroke-width="3.5" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Geometric Mesh Network Facets -->
  <!-- Top Apex to Center -->
  <line x1="50" y1="18" x2="50" y2="52" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.9" />
  <!-- Center to Left Wing -->
  <line x1="50" y1="52" x2="28" y2="38" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.9" />
  <!-- Center to Right Wing -->
  <line x1="50" y1="52" x2="72" y2="38" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.9" />
  <!-- Center to Bottom Apex -->
  <line x1="50" y1="52" x2="50" y2="80" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.9" />
  <!-- Left Wing to Bottom Apex -->
  <line x1="28" y1="38" x2="50" y2="80" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
  <!-- Right Wing to Bottom Apex -->
  <line x1="72" y1="38" x2="50" y2="80" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
  <!-- Top Apex to Wings -->
  <line x1="50" y1="18" x2="28" y2="38" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="50" y1="18" x2="72" y2="38" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Mesh Vertices (Nodes) -->
  <circle cx="50" cy="18" r="3" fill="#ffffff" filter="url(#glow)" />
  <circle cx="28" cy="38" r="3" fill="#ffffff" filter="url(#glow)" />
  <circle cx="72" cy="38" r="3" fill="#ffffff" filter="url(#glow)" />
  <circle cx="50" cy="52" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)" />
  <circle cx="50" cy="80" r="3" fill="#ffffff" filter="url(#glow)" />
</svg>
