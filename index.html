<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credence Documentation &amp; Sovereign Blog</title>
  <meta name="description" content="Decoupled documentation and sovereign editorial blog engine for the Credence network. Zero npm dependencies, 100% zero-build.">
  
  <!-- Open Graph / Social Media Sharing Previews -->
  <meta property="og:site_name" content="Credence Epistemic Network">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Credence Documentation &amp; Sovereign Blog">
  <meta property="og:description" content="Decoupled documentation and sovereign editorial blog engine for the Credence network. Zero npm dependencies, 100% zero-build.">
  <meta property="og:url" content="https://credence.run/docs/">
  <meta property="og:image" content="assets/og-card.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Credence: Decentralized Epistemic Verification Engine">
  <meta name="theme-color" content="#090d16">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="alternate icon" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  
  <!-- Invariant 20: Strict CSP & Zero Supply-Chain Security -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://credence.run; style-src 'self' 'unsafe-inline' https://credence.run; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; img-src 'self' data: https://credence.run; connect-src 'self' https://credence.run https://cloudflareinsights.com;">
  
  <link rel="stylesheet" href="styles.css">
      <script type="module" src="assets/credence-widget.js"></script>
</head>
<body>

  <!-- Unified Ecosystem Navigation Bar -->
  <nav class="credence-nav">
    <a href="https://credence.run" class="brand"><img src="assets/logo.svg" alt="Credence Shield" class="brand-logo"> Credence <span class="badge" id="brand-badge">v2.14.0</span></a>

    <ul class="nav-links">
      <li><a href="https://credence.run">Home</a></li>
      <li><a href="#docs/intro" class="active">Docs</a></li>
      <li><a href="https://credence.report">Reports</a></li>
      <li><a href="https://credence.nexus">Nexus</a></li>
      <li><a href="https://credence.foundation">Foundation</a></li>
    </ul>
  </nav>

  <!-- Main Documentation Layout -->
  <div class="docs-layout">
    <!-- Sidebar Navigation -->
    <aside class="docs-sidebar">
      <div class="search-container">
        <div class="search-input-wrapper">
          <input type="text" id="doc-search" class="search-input" placeholder="Search docs, tags, #invariants..." autocomplete="off">
          <kbd class="search-kbd">/</kbd>
        </div>
        <div class="search-filter-pills" id="search-filter-pills">
          <button type="button" class="filter-pill active" data-filter="all">All</button>
          <button type="button" class="filter-pill" data-filter="playgrounds">Playgrounds</button>
          <button type="button" class="filter-pill" data-filter="invariants">Invariants</button>
          <button type="button" class="filter-pill" data-filter="agentic">Agentic</button>
          <button type="button" class="filter-pill" data-filter="fastmcp">FastMCP</button>
          <button type="button" class="filter-pill" data-filter="tutorials">Tutorials</button>
        </div>
      </div>
      <div id="sidebar-nav">
        <!-- Injected dynamically by app.js -->
      </div>
    </aside>

    <!-- Content Reading Area -->
    <main class="docs-main">
      <article id="doc-content" class="markdown-body">
        <!-- Markdown injected dynamically by app.js -->
      </article>
    </main>

    <!-- Table of Contents Sidebar -->
    <aside class="toc-sidebar">
      <div class="toc-heading">On this page</div>
      <ul id="toc-list" class="toc-list">
        <!-- Injected dynamically by app.js -->
      </ul>
    </aside>
  </div>

  <!-- Zero-Build ES Module Application Bootstrap -->
  <script type="module">
    import { initRouter } from './app.js';
    initRouter();
  </script>
</body>
</html>
