<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credence Documentation &amp; Sovereign Blog</title>
  <meta name="description" content="Decoupled documentation and sovereign editorial blog engine for the Credence network. Zero npm dependencies, 100% zero-build.">
  
  <!-- Invariant 20: Strict CSP & Zero Supply-Chain Security -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://credence.run; style-src 'self' 'unsafe-inline' https://credence.run; script-src 'self' 'unsafe-inline'; img-src 'self' data: https://credence.run; connect-src 'self' https://credence.run;">
  
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
</head>
<body>

  <!-- Unified Ecosystem Navigation Bar -->
  <nav class="credence-nav">
    <a href="https://credence.run" class="brand">
      <img src="assets/logo.svg" alt="Credence Shield" style="width: 24px; height: 24px; vertical-align: middle; margin-right: 0.5rem;">
      Credence <span class="badge">v1.0.1</span>
    </a>
    <ul class="nav-links">
      <li><a href="https://credence.run">Home</a></li>
      <li><a href="#docs/intro" class="active">Docs</a></li>
      <li><a href="#blog/the-blue-checkmark-is-dead">Blog</a></li>
      <li><a href="https://credence.report/viewer.html">Report Viewer</a></li>
      <li><a href="https://github.com/credence-network/credence" target="_blank" rel="noopener">GitHub</a></li>
    </ul>
  </nav>

  <!-- Main Documentation Layout -->
  <div class="docs-layout">
    <!-- Sidebar Navigation -->
    <aside class="docs-sidebar">
      <div class="search-container">
        <input type="text" id="doc-search" class="search-input" placeholder="Search documentation..." autocomplete="off">
      </div>
      <div id="sidebar-nav">
        <!-- Injected dynamically by app.js -->
      </div>
    </aside>

    <!-- Content Reading Area -->
    <main class="docs-main">
      <article id="doc-content" class="markdown-body">
        <!-- Markdown injected dynamically by app.js -->
      </article>
    </main>

    <!-- Table of Contents Sidebar -->
    <aside class="toc-sidebar">
      <div class="toc-heading">On this page</div>
      <ul id="toc-list" class="toc-list">
        <!-- Injected dynamically by app.js -->
      </ul>
    </aside>
  </div>

  <!-- Zero-Build ES Module Application Bootstrap -->
  <script type="module">
    import { initRouter } from './app.js';
    initRouter();
  </script>
</body>
</html>
